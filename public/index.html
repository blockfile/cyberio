<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CYBERIO | MMORPG Card Battle"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.jpg" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Press+Start+2P&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Share+Tech&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>CYBERIO</title>
    <style>
      html, body { margin: 0; background: #05060a; }
      /* boot splash — cyberpunk, painted instantly on load/refresh before React mounts */
      #boot-loader {
        position: fixed; inset: 0; z-index: 2147483600; --a: #49b6ff;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
        background: #05060a; opacity: 1; transition: opacity .5s ease;
        font-family: "Silkscreen", "Press Start 2P", ui-monospace, "Courier New", monospace;
      }
      #boot-loader.bl-hide { opacity: 0; pointer-events: none; }
      /* neon perspective floor grid */
      #boot-loader .bl-grid {
        position: absolute; left: 50%; bottom: -12%; width: 220%; height: 56%;
        transform: translateX(-50%) perspective(440px) rotateX(63deg); transform-origin: bottom center;
        background-image: linear-gradient(to right, var(--a) 1px, transparent 1px), linear-gradient(to bottom, var(--a) 1px, transparent 1px);
        background-size: 46px 46px; opacity: .3;
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 82%); mask-image: linear-gradient(to top, #000 0%, transparent 82%);
        animation: blGrid 1.3s linear infinite;
      }
      @keyframes blGrid { from { background-position-y: 0; } to { background-position-y: 46px; } }
      #boot-loader .bl-tint { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 30%, rgba(73,182,255,.10), transparent 60%); }
      #boot-loader .bl-scan { position: absolute; inset: 0; pointer-events: none; opacity: .22; mix-blend-mode: overlay; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.09) 0 1px, transparent 1px 4px); }
      #boot-loader .bl-vig { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 230px 70px rgba(0,0,0,.85); }
      /* HUD corner brackets */
      #boot-loader .bl-corner { position: absolute; width: 46px; height: 46px; border: 2px solid var(--a); filter: drop-shadow(0 0 6px var(--a)); opacity: .85; animation: blCorner 2.6s ease-in-out infinite; }
      #boot-loader .bl-corner.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
      #boot-loader .bl-corner.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
      #boot-loader .bl-corner.bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; }
      #boot-loader .bl-corner.br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; }
      @keyframes blCorner { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .95; transform: scale(1.08); } }
      #boot-loader .bl-center { position: relative; z-index: 2; text-align: center; padding: 0 24px; }
      /* spinner rig */
      #boot-loader .bl-rig { position: relative; width: 120px; height: 120px; margin: 0 auto 26px; }
      #boot-loader .bl-hex { position: absolute; inset: 0; border: 2px dashed var(--a); opacity: .45; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); animation: blSpin 6s linear infinite; }
      #boot-loader .bl-ring { position: absolute; inset: 18px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--a); filter: drop-shadow(0 0 10px var(--a)); animation: blSpin .95s linear infinite; }
      #boot-loader .bl-ring.r2 { inset: 32px; border-top-color: #fff; opacity: .85; animation-duration: 1.5s; animation-direction: reverse; }
      #boot-loader .bl-core { position: absolute; inset: 46px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--a) 55%, transparent 78%); box-shadow: 0 0 26px var(--a); animation: blPulse 1.1s ease-in-out infinite; }
      @keyframes blSpin { to { transform: rotate(360deg); } }
      @keyframes blPulse { 0%,100% { transform: scale(.7); opacity: .7; } 50% { transform: scale(1); opacity: 1; } }
      /* glitch brand */
      #boot-loader .bl-brand { position: relative; font-size: clamp(30px, 5.5vw, 48px); font-weight: 900; letter-spacing: .16em; color: #fff; text-shadow: 0 0 20px var(--a), 0 0 3px var(--a); }
      #boot-loader .bl-brand::before, #boot-loader .bl-brand::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; }
      #boot-loader .bl-brand::before { color: #ff2bd6; transform: translate(-2px, 0); mix-blend-mode: screen; animation: blGlA 1.8s infinite steps(2); }
      #boot-loader .bl-brand::after { color: #00e5ff; transform: translate(2px, 0); mix-blend-mode: screen; animation: blGlB 2.1s infinite steps(2); }
      @keyframes blGlA { 0%,92%,100% { opacity: 0; clip-path: inset(0 0 100% 0); } 93% { opacity: .9; clip-path: inset(18% 0 42% 0); } 96% { clip-path: inset(58% 0 12% 0); } }
      @keyframes blGlB { 0%,90%,100% { opacity: 0; clip-path: inset(0 0 100% 0); } 91% { opacity: .8; clip-path: inset(40% 0 30% 0); } 95% { clip-path: inset(8% 0 70% 0); } }
      #boot-loader .bl-action { margin-top: 10px; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: #dfe9f7; opacity: .85; }
      #boot-loader .bl-dots::after { content: ""; animation: blDots 1.2s steps(4, end) infinite; }
      @keyframes blDots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } 100% { content: ""; } }
      /* progress bar */
      #boot-loader .bl-bar { position: relative; margin: 24px auto 0; width: min(360px, 72vw); height: 9px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.08); border: 1px solid var(--a); box-shadow: 0 0 14px -2px var(--a); }
      #boot-loader .bl-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 8%; border-radius: 6px; background: linear-gradient(90deg, rgba(0,0,0,.2), var(--a)); box-shadow: 0 0 16px var(--a); animation: blFill 1.8s ease-out forwards; }
      @keyframes blFill { from { width: 8%; } to { width: 94%; } }
      #boot-loader .bl-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: blShim 1s ease-in-out infinite; }
      @keyframes blShim { to { transform: translateX(100%); } }
      /* equalizer */
      #boot-loader .bl-eq { display: flex; gap: 3px; justify-content: center; align-items: flex-end; height: 26px; margin: 18px auto 0; }
      #boot-loader .bl-eq i { width: 4px; height: 100%; background: var(--a); box-shadow: 0 0 8px var(--a); transform-origin: bottom; opacity: .85; animation: blEq .9s ease-in-out infinite; }
      @keyframes blEq { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
      #boot-loader .bl-tip { margin-top: 14px; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .bl-grid, #boot-loader .bl-hex, #boot-loader .bl-ring, #boot-loader .bl-core, #boot-loader .bl-corner,
        #boot-loader .bl-brand::before, #boot-loader .bl-brand::after, #boot-loader .bl-bar i, #boot-loader .bl-bar::after,
        #boot-loader .bl-eq i, #boot-loader .bl-dots::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="boot-loader">
      <div class="bl-grid"></div>
      <div class="bl-tint"></div>
      <div class="bl-scan"></div>
      <div class="bl-vig"></div>
      <span class="bl-corner tl"></span><span class="bl-corner tr"></span>
      <span class="bl-corner bl"></span><span class="bl-corner br"></span>
      <div class="bl-center">
        <div class="bl-rig">
          <div class="bl-hex"></div>
          <div class="bl-ring"></div>
          <div class="bl-ring r2"></div>
          <div class="bl-core"></div>
        </div>
        <div class="bl-brand" data-text="CYBERIO">CYBERIO</div>
        <div class="bl-action">LOADING GAME CODE<em class="bl-dots"></em></div>
        <div class="bl-bar"><i></i></div>
        <div class="bl-eq">
          <i style="animation-delay:0s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.1s"></i>
          <i style="animation-delay:.15s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.25s"></i>
          <i style="animation-delay:.3s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.2s"></i>
          <i style="animation-delay:.15s"></i><i style="animation-delay:.1s"></i><i style="animation-delay:.05s"></i>
          <i style="animation-delay:0s"></i>
        </div>
        <div class="bl-tip">TIP: Right-click a player in the arena to duel</div>
      </div>
    </div>
  </body>
</html>
